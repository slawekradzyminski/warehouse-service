name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify application
        run: ./mvnw --batch-mode verify

  native:
    # The published image is the GraalVM native executable. JVM tests cannot see missing
    # native metadata or runtime-proxy limits, so the binary itself is booted against Postgres.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Build native container
        run: docker build --tag warehouse-service:native .

      - name: Smoke test native container against Postgres
        run: scripts/native-smoke.sh warehouse-service:native
