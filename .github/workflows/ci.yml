name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify application
        run: ./mvnw --batch-mode verify

  native:
    # The published image is the GraalVM native executable. JVM tests cannot see missing
    # native metadata or runtime-proxy limits, so the binary itself is booted against Postgres.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # BuildKit with the GitHub Actions cache (was plain `docker build`, which cached nothing). A PR whose
      # sources match the master cache reuses every layer; the image content is unchanged, only reused.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Only master pushes write the cache: caches created on a PR ref are readable by that PR alone, and
      # master's cache is readable by PRs and by the tag-triggered publish-image.yml, which reuses the
      # compiled layers when the tagged tree is the tree built here. Scope name matches publish-image.yml.
      - name: Build native container
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: warehouse-service:native
          cache-from: type=gha,scope=native-linux-amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=native-linux-amd64' || '' }}
          provenance: false
          sbom: false

      - name: Smoke test native container against Postgres
        run: scripts/native-smoke.sh warehouse-service:native

  # Warms the arm64 build cache that publish-image.yml reads, and boots the arm64 binary before release.
  # Only master pushes run it: the publish workflow builds arm64 anyway, and PRs gain nothing from a second
  # architecture. Skipped on PRs, so it never delays a PR check (a skipped job counts as passed).
  native-arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build native container
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: warehouse-service:native
          cache-from: type=gha,scope=native-linux-arm64
          cache-to: type=gha,mode=max,scope=native-linux-arm64
          provenance: false
          sbom: false

      - name: Smoke test native container against Postgres
        run: scripts/native-smoke.sh warehouse-service:native
