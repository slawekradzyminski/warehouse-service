# Local run next to the backend's local profile: the same PostgreSQL database
# (localhost:5432/testdb, schema "warehouse"), with demo suppliers seeded:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb?currentSchema=warehouse
    username: postgres
    password: postgres

backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:4001}

warehouse:
  service-token: ${WAREHOUSE_SERVICE_TOKEN:local-warehouse-token}
  seed-demo-data: true
