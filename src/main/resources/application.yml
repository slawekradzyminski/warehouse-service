spring:
  application:
    name: warehouse-service
  # PostgreSQL by default; SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD override it.
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb?currentSchema=warehouse
    username: postgres
    password: postgres
    hikari:
      # Small footprint: the backend's Postgres is shared and memory-capped.
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 120000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: warehouse
  flyway:
    enabled: true
    schemas: warehouse
    default-schema: warehouse
    create-schemas: true
  # Artemis client of the broker transport (warehouse.events.transport=broker); SPRING_ARTEMIS_BROKER_URL,
  # _USER and _PASSWORD override it. It connects only when the listener starts. The plain connection
  # factory: Spring's CachingConnectionFactory hands out JDK proxies the native image cannot create, and
  # the listener container keeps its own connection.
  jms:
    cache:
      enabled: false
  artemis:
    mode: native
    broker-url: tcp://activemq:61616
    user: admin
    password: admin
  jmx:
    enabled: false
  main:
    banner-mode: "off"

server:
  port: 4003
  tomcat:
    threads:
      max: 20
      min-spare: 2
    accept-count: 50
    max-connections: 200
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:4001}
  connect-timeout: 2s
  read-timeout: 10s

warehouse:
  service-token: ${WAREHOUSE_SERVICE_TOKEN:local-warehouse-token}
  # Expected from the backend on the stock ledger API (/internal/v1/stock, sent as
  # "Authorization: Bearer <token>"). Unset, that API answers 404; required in Docker.
  backend-service-token: ${BACKEND_SERVICE_TOKEN:}
  # The stock ledger (owner of stock quantities and movements since 1.6.0).
  stock:
    # On startup, an empty ledger is imported from the backend (GET /internal/v1/inventory/export);
    # the stock API answers 503 until the import is done.
    import-enabled: ${WAREHOUSE_STOCK_IMPORT_ENABLED:true}
    # Levels the backend projection did not accept are pushed again at this interval.
    push-retry-enabled: ${WAREHOUSE_STOCK_PUSH_RETRY_ENABLED:true}
    push-retry-interval: ${WAREHOUSE_STOCK_PUSH_RETRY_INTERVAL:PT5S}
    # Reservations still unconfirmed after the timeout are confirmed (when the backend has an
    # order for them) or released, checked at the reaper interval.
    reaper-enabled: ${WAREHOUSE_RESERVATION_REAPER_ENABLED:true}
    reservation-confirm-timeout: ${WAREHOUSE_RESERVATION_CONFIRM_TIMEOUT:PT2M}
    reservation-reaper-interval: ${WAREHOUSE_RESERVATION_REAPER_INTERVAL:PT30S}
  # Demo suppliers and the demo location split (Gdansk ships Books, Home & Kitchen and
  # Wearables); enabled by the local and demo profiles.
  seed-demo-data: false
  # Receives the backend's commerce events (order.cancelled cancels the shipment of an order that is
  # still AWAITING_PICK or PICKED, stock.restore-requested restores stock): by polling the event feed
  # (GET /internal/v1/events, transport feed) or from this service's Artemis queue (transport broker,
  # docs/EVENT_BROKER_CONTRACT.md in awesome-localstack).
  events:
    enabled: ${WAREHOUSE_EVENTS_ENABLED:true}
    transport: ${EVENTS_TRANSPORT:feed}
    poll-interval: ${WAREHOUSE_EVENTS_POLL_INTERVAL:PT5S}
    broker:
      # Multicast address of the backend's events; this service reads <address>::<address>.warehouse-service.
      address: ${EVENTS_BROKER_ADDRESS:awesome.commerce.events}
      concurrency: ${EVENTS_BROKER_CONCURRENCY:1}
  # Safety net behind the event feed: cancels shipments whose order was cancelled on
  # the backend, adopts orders released without a shipment and fills the lines of
  # shipments created before 1.5.0.
  reconcile:
    enabled: ${WAREHOUSE_RECONCILE_ENABLED:true}
    interval: ${WAREHOUSE_RECONCILE_INTERVAL:PT10M}
  # Retries customer notifications from the outbox that the backend did not accept.
  notifications:
    retry-enabled: ${WAREHOUSE_NOTIFICATIONS_RETRY_ENABLED:true}
    retry-interval: ${WAREHOUSE_NOTIFICATIONS_RETRY_INTERVAL:PT30S}
  # Simulated carrier for shipments handed over without a tracking number: every
  # step interval each one advances by one scan (IN_TRANSIT, IN_TRANSIT,
  # OUT_FOR_DELIVERY, [DELIVERY_FAILED, OUT_FOR_DELIVERY,] DELIVERED).
  carrier:
    enabled: ${WAREHOUSE_CARRIER_ENABLED:true}
    step-interval: ${WAREHOUSE_CARRIER_STEP_INTERVAL:PT2M}

  # OpenTelemetry tracing, off by default (see TracingConfig). TRACING_ENABLED is read at
  # runtime, so the same native image runs with and without tracing.
  tracing:
    enabled: ${TRACING_ENABLED:false}

security:
  jwt:
    # Access tokens are RS256-signed by the backend and verified with the keys it
    # publishes at /internal/v1/jwks.json; an unknown key id refetches them at most
    # this often.
    jwks-refresh-interval: ${JWT_JWKS_REFRESH_INTERVAL:10s}

management:
  # The broker is optional (feed transport by default), so it is not part of application health.
  health:
    jms:
      enabled: false
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      # stockLedger reports IMPORTING during the startup ledger import: ordered after UP here, so
      # /actuator/health (the container healthcheck) stays 200 while the stock API answers 503,
      # and ordered first in the readiness group, which then answers 503.
      status:
        order: DOWN,OUT_OF_SERVICE,UP,IMPORTING,UNKNOWN
      group:
        readiness:
          include: readinessState,stockLedger
          status:
            order: DOWN,OUT_OF_SERVICE,IMPORTING,UP,UNKNOWN
            http-mapping:
              IMPORTING: 503
  # Tracing beans are always built (Spring AOT fixes bean conditions at image build time);
  # warehouse.tracing.enabled decides at runtime whether anything is sampled and exported.
  tracing:
    sampling:
      # New traces only; a sampled incoming traceparent is always followed. Used only when enabled.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    baggage:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
  # Human-readable lines carry [traceId,requestId] from the MDC (set by CorrelationFilter,
  # the event feed and the scheduled jobs). LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs switches
  # to JSON lines in which requestId, traceId and spanId are fields.
  pattern:
    correlation: "[%X{traceId:-},%X{requestId:-}] "
